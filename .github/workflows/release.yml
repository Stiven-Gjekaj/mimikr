# Builds the application of a release for macOS, Windows and Linux, and
# publishes it only from a tag.
#
# A run started by hand builds the application and tests it, and it publishes
# nothing. That is the way to test this file without a release.
#
# The job that publishes is the only job that holds a write token, and it runs
# only for a tag. It opens a draft, so that a person reads the release before
# anybody can download it.
#
# Every action is pinned to the commit of a release, for the reason that
# ci.yml gives.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build on ${{ matrix.system }}
    strategy:
      # A release that lacks one system is not a release.
      fail-fast: true
      matrix:
        include:
          - system: macos
            os: macos-latest
            program: dist/mimikr.app/Contents/MacOS/mimikr
          - system: windows
            os: windows-latest
            program: dist/mimikr/mimikr.exe
          - system: linux
            os: ubuntu-latest
            program: dist/mimikr/mimikr
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: install the libraries of Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

      # The runner has no rsvg-convert, so the macOS build uses the icon.icns
      # of the repository.
      - name: build the application
        run: |
          if [ "${{ matrix.system }}" = macos ]; then
            scripts/build-macos-app.sh
          else
            uv run --group build python scripts/build-app.py
          fi

      # The application must read identities and open its window before
      # anybody downloads it.
      - name: test the built application
        run: uv run python scripts/smoke-test-app.py "${{ matrix.program }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.system }}
          path: |
            dist/mimikr-*.zip
            dist/mimikr-*.tar.gz
          if-no-files-found: error

  release:
    name: publish a draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      # A tag that disagrees with the version in pyproject.toml gives files
      # whose names name a release that they do not belong to.
      - name: check that the tag names the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "The tag is ${GITHUB_REF_NAME} and pyproject.toml says ${version}." >&2
            exit 1
          fi
          ls -l dist

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/mimikr-*

      - name: open the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --title "mimikr ${GITHUB_REF_NAME}" \
            --generate-notes
