<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 732 202" width="732" height="202" role="img" aria-label="mimikr">
  <title>mimikr</title>

  <defs>
    <!-- The colors of a chameleon, from violet to green. The gradient moves
         along the word, so the letters change color the way a mimic does. -->
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0.3" spreadMethod="reflect">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.35" stop-color="#60a5fa"/>
      <stop offset="0.7" stop-color="#34d399"/>
      <stop offset="1" stop-color="#a3e635"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="0 0;1 0;0 0" dur="12s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- The mirror image fades out from its top edge. -->
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="reflection" maskUnits="userSpaceOnUse" x="0" y="148" width="732" height="54">
      <rect x="0" y="148" width="732" height="54" fill="url(#fade)"/>
    </mask>

    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- One scanline, tiled. -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.28"/>
    </pattern>
  </defs>

  <rect width="732" height="202" rx="16" fill="#07090f"/>
  <rect x="6" y="6" width="720" height="190" rx="11"
        fill="none" stroke="#60a5fa" stroke-opacity="0.28" stroke-width="2"/>

  <g filter="url(#glow)">
    <path d="M12 0h60v12h-60zM0 12h12v12h-12zM72 12h12v12h-12zM0 24h12v12h-12zM72 24h12v12h-12zM0 36h12v12h-12zM72 36h12v12h-12zM12 48h60v12h-60zM12 60h24v12h-24zM12 72h12v12h-12z" fill="#a78bfa" opacity="0.6"
          transform="translate(48 40)"/>
    <path d="M0 0h12v12h-12zM48 0h12v12h-12zM72 0h60v12h-60zM144 0h12v12h-12zM192 0h12v12h-12zM216 0h60v12h-60zM288 0h12v12h-12zM336 0h12v12h-12zM360 0h48v12h-48zM0 12h24v12h-24zM36 12h24v12h-24zM96 12h12v12h-12zM144 12h24v12h-24zM180 12h24v12h-24zM240 12h12v12h-12zM288 12h12v12h-12zM324 12h12v12h-12zM360 12h12v12h-12zM408 12h12v12h-12zM0 24h12v12h-12zM24 24h12v12h-12zM48 24h12v12h-12zM96 24h12v12h-12zM144 24h12v12h-12zM168 24h12v12h-12zM192 24h12v12h-12zM240 24h12v12h-12zM288 24h12v12h-12zM312 24h12v12h-12zM360 24h12v12h-12zM408 24h12v12h-12zM0 36h12v12h-12zM24 36h12v12h-12zM48 36h12v12h-12zM96 36h12v12h-12zM144 36h12v12h-12zM168 36h12v12h-12zM192 36h12v12h-12zM240 36h12v12h-12zM288 36h24v12h-24zM360 36h48v12h-48zM0 48h12v12h-12zM48 48h12v12h-12zM96 48h12v12h-12zM144 48h12v12h-12zM192 48h12v12h-12zM240 48h12v12h-12zM288 48h12v12h-12zM312 48h12v12h-12zM360 48h12v12h-12zM384 48h12v12h-12zM0 60h12v12h-12zM48 60h12v12h-12zM96 60h12v12h-12zM144 60h12v12h-12zM192 60h12v12h-12zM240 60h12v12h-12zM288 60h12v12h-12zM324 60h12v12h-12zM360 60h12v12h-12zM396 60h12v12h-12zM0 72h12v12h-12zM48 72h12v12h-12zM72 72h60v12h-60zM144 72h12v12h-12zM192 72h12v12h-12zM216 72h60v12h-60zM288 72h12v12h-12zM336 72h12v12h-12zM360 72h12v12h-12zM408 72h12v12h-12z" fill="url(#ink)" transform="translate(156 40)"/>
    <rect x="606" y="112" width="12" height="12" fill="#34d399" opacity="0.35">
      <animate attributeName="opacity" values="0.35;1;0.35;0.35" dur="1.2s"
               begin="0.0s" repeatCount="indefinite"/>
    </rect>
    <rect x="630" y="112" width="12" height="12" fill="#34d399" opacity="0.35">
      <animate attributeName="opacity" values="0.35;1;0.35;0.35" dur="1.2s"
               begin="0.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="654" y="112" width="12" height="12" fill="#34d399" opacity="0.35">
      <animate attributeName="opacity" values="0.35;1;0.35;0.35" dur="1.2s"
               begin="0.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g mask="url(#reflection)">
    <path d="M0 0h12v12h-12zM48 0h12v12h-12zM72 0h60v12h-60zM144 0h12v12h-12zM192 0h12v12h-12zM216 0h60v12h-60zM288 0h12v12h-12zM336 0h12v12h-12zM360 0h48v12h-48zM0 12h24v12h-24zM36 12h24v12h-24zM96 12h12v12h-12zM144 12h24v12h-24zM180 12h24v12h-24zM240 12h12v12h-12zM288 12h12v12h-12zM324 12h12v12h-12zM360 12h12v12h-12zM408 12h12v12h-12zM0 24h12v12h-12zM24 24h12v12h-12zM48 24h12v12h-12zM96 24h12v12h-12zM144 24h12v12h-12zM168 24h12v12h-12zM192 24h12v12h-12zM240 24h12v12h-12zM288 24h12v12h-12zM312 24h12v12h-12zM360 24h12v12h-12zM408 24h12v12h-12zM0 36h12v12h-12zM24 36h12v12h-12zM48 36h12v12h-12zM96 36h12v12h-12zM144 36h12v12h-12zM168 36h12v12h-12zM192 36h12v12h-12zM240 36h12v12h-12zM288 36h24v12h-24zM360 36h48v12h-48zM0 48h12v12h-12zM48 48h12v12h-12zM96 48h12v12h-12zM144 48h12v12h-12zM192 48h12v12h-12zM240 48h12v12h-12zM288 48h12v12h-12zM312 48h12v12h-12zM360 48h12v12h-12zM384 48h12v12h-12zM0 60h12v12h-12zM48 60h12v12h-12zM96 60h12v12h-12zM144 60h12v12h-12zM192 60h12v12h-12zM240 60h12v12h-12zM288 60h12v12h-12zM324 60h12v12h-12zM360 60h12v12h-12zM396 60h12v12h-12zM0 72h12v12h-12zM48 72h12v12h-12zM72 72h60v12h-60zM144 72h12v12h-12zM192 72h12v12h-12zM216 72h60v12h-60zM288 72h12v12h-12zM336 72h12v12h-12zM360 72h12v12h-12zM408 72h12v12h-12z" fill="url(#ink)"
          transform="translate(156 232) scale(1 -1)"/>
  </g>

  <rect width="732" height="202" rx="16" fill="url(#scanlines)"
        opacity="0.5" pointer-events="none"/>
</svg>
