<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 201" width="756" height="201" role="img" aria-label="mimikr">
  <title>mimikr</title>

  <defs>
    <!-- The colors of a chameleon, from violet to green. The gradient moves
         along the word, so the letters change color the way a mimic does. -->
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0.3" spreadMethod="reflect">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.35" stop-color="#60a5fa"/>
      <stop offset="0.7" stop-color="#34d399"/>
      <stop offset="1" stop-color="#a3e635"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="0 0;1 0;0 0" dur="12s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- One scanline, tiled. -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.28"/>
    </pattern>
  </defs>

  <rect width="756" height="201" rx="16" fill="#07090f"/>
  <rect x="6" y="6" width="744" height="189" rx="11"
        fill="none" stroke="#60a5fa" stroke-opacity="0.28" stroke-width="2"/>

  <g filter="url(#glow)">
    <path d="M15 0h75v15h-75zM0 15h15v15h-15zM90 15h15v15h-15zM0 30h15v15h-15zM90 30h15v15h-15zM0 45h15v15h-15zM90 45h15v15h-15zM15 60h75v15h-75zM15 75h30v15h-30zM15 90h15v15h-15z" fill="#a78bfa" opacity="0.6"
          transform="translate(48 48)"/>
    <path d="M0 0h15v15h-15zM60 0h15v15h-15zM90 0h75v15h-75zM180 0h15v15h-15zM240 0h15v15h-15zM270 0h75v15h-75zM360 0h15v15h-15zM420 0h15v15h-15zM450 0h60v15h-60zM0 15h30v15h-30zM45 15h30v15h-30zM120 15h15v15h-15zM180 15h30v15h-30zM225 15h30v15h-30zM300 15h15v15h-15zM360 15h15v15h-15zM405 15h15v15h-15zM450 15h15v15h-15zM510 15h15v15h-15zM0 30h15v15h-15zM30 30h15v15h-15zM60 30h15v15h-15zM120 30h15v15h-15zM180 30h15v15h-15zM210 30h15v15h-15zM240 30h15v15h-15zM300 30h15v15h-15zM360 30h15v15h-15zM390 30h15v15h-15zM450 30h15v15h-15zM510 30h15v15h-15zM0 45h15v15h-15zM30 45h15v15h-15zM60 45h15v15h-15zM120 45h15v15h-15zM180 45h15v15h-15zM210 45h15v15h-15zM240 45h15v15h-15zM300 45h15v15h-15zM360 45h30v15h-30zM450 45h60v15h-60zM0 60h15v15h-15zM60 60h15v15h-15zM120 60h15v15h-15zM180 60h15v15h-15zM240 60h15v15h-15zM300 60h15v15h-15zM360 60h15v15h-15zM390 60h15v15h-15zM450 60h15v15h-15zM480 60h15v15h-15zM0 75h15v15h-15zM60 75h15v15h-15zM120 75h15v15h-15zM180 75h15v15h-15zM240 75h15v15h-15zM300 75h15v15h-15zM360 75h15v15h-15zM405 75h15v15h-15zM450 75h15v15h-15zM495 75h15v15h-15zM0 90h15v15h-15zM60 90h15v15h-15zM90 90h75v15h-75zM180 90h15v15h-15zM240 90h15v15h-15zM270 90h75v15h-75zM360 90h15v15h-15zM420 90h15v15h-15zM450 90h15v15h-15zM510 90h15v15h-15z" fill="url(#ink)" transform="translate(183 48)"/>
  </g>

  <rect width="756" height="201" rx="16" fill="url(#scanlines)"
        opacity="0.5" pointer-events="none"/>
</svg>
