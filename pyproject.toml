[project]
name = "mimikr"
version = "1.1.0"
description = "A local chatbot that writes like a person, from a personality file and a chat transcript."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "httpx>=0.27",
]

[project.scripts]
mimikr = "mimikr.cli:main"

[dependency-groups]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mimikr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
